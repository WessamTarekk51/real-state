    <div id="page" >
      @if(currentUser$ | async){
      <div id="sideBar">
        <app-side-bar></app-side-bar>
      </div>
      }
      <div id="routerPage" [ngClass]="{'notLogin' : currentUser$}">
        @if(currentUser$ | async){
        <div class="top">
          <app-top-bar [title]="title"></app-top-bar>
        </div>
        }
        <div class="page" [@routeAnimation]="prepareRoute(outlet)" [ngClass]="{'notLogin' : currentUser$}">
          <router-outlet #outlet="outlet" (activate)="getTitle($event)" />
        </div>
        <app-loading></app-loading>
      </div>
    </div>
