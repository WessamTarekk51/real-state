@if (currentUser$ | async; as user) {
<div class="top-bar">
  <div class="space-between">
    <div class="title-bar">
      <p>{{title}}</p>
    </div>
    <div class="details-user">
      <div class="notifer">
        <div class="counter-notifer">2</div>
      </div>
      <div class="image">
        <p>{{getInitials(user.userName)}}</p>
      </div>
      <div class="name">
        <p> {{user.userName}}</p>
      </div>
      <div class="dropDown"></div>
    </div>
  </div>
</div>
}
