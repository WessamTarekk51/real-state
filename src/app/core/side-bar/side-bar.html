<div class="sideBar">
  <div class="logo">
    <img src="/assets/images/logo.png" alt="">
  </div>

  <div class="menu">
    <!-- استخدم menuItems بعد الفلترة -->
    <p-panelMenu [model]="menuItems" class="nav"></p-panelMenu>

    <ng-template let-item pTemplate="item">
      <div>
        <span
          class="p-menuitem-icon"
          [routerLink]="item.routerLink"
          [ngClass]="{'active': isActive(item)}"
        ></span>
        <div class="Ptext">{{ item.label }}</div>
      </div>
    </ng-template>
  </div>

  <div class="logout">
    <p (click)="logOut()">تسجيل الخروج</p>
  </div>
</div>
