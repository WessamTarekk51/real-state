<div id="container-page" *ngIf="workerDetailes != undefined">
  <div class="container-detailes">
    <div class="space-between">
      <div class="title">
        <p>{{workerDetailes.name}}</p>
      </div>
      <div class="w80f">
        <div class="buttons">
          <app-button [className]="'orange'" [buttonTxt]="'تعديل'" (click)="editWorker()"></app-button>
          <app-button [className]="'main'" [buttonTxt]="'تصدير إلى Excel'"></app-button>
        </div>
      </div>
    </div>
    <div class="space-between">
      <div class="txt w50f">
        <p> رقم الهاتف</p>
      </div>
      <div class="des w50f end">
        <p>{{workerDetailes.phone}}</p>
      </div>
    </div>
    <div class="space-between">
      <div class="txt w50f">
        <p>  الوظيفة</p>
      </div>
      <div class="des w50f end">
        <p></p>
      </div>
    </div>
     <div class="space-between">
      <div class="txt w50f">
        <p>  تاريخ الانشاء</p>
      </div>
      <div class="des w50f end">
        <p>{{SharedServices.convertToArabicDate(workerDetailes.createdDate)}}</p>
      </div>
    </div>
  </div>
</div>
